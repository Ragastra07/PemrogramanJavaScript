<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<table>
    <tbody>
        <tr>
            <td> Id : </td>
            <td id="Id"></td>
        </tr>
        <tr>
            <td> Name : </td>
            <td id="Name"></td>
        </tr>
        <tr>
            <td> Price : </td>
            <td id="Price"></td>
        </tr>
    </tbody>
</table>
<script>
    function GetProduct() {
        return new Promise(function(resolve, reject){
        const ajax = new XMLHttpRequest();
        ajax.open("GET", "API/product.json");
        ajax.onload = function () {
            if (ajax.status === 200) {
                resolve(ajax.responseText);
            } else {
                reject(`error get product with respond : ${ajax.status}`);
            }
        };
        ajax.send();
    });
    };
    GetProduct()
        .then(function (response) {
            return JSON.parse(response);
        })
        .then(function(json){
            document.getElementById("Id").textContent = json.Id;
            document.getElementById("Name").textContent = json.Name;
            document.getElementById("Price").textContent = json.Price;
        })
        .catch(function(ERROR){
            document.getElementById("Id").textContent = ERROR;
            document.getElementById("Name").textContent = ERROR;
            document.getElementById("Price").textContent = ERROR;
        })
        .finally(function() {
            const massage = document.createElement("h1");
            massage.textContent = "success";
            document.body.appendChild(massage);
        })
    
</script>
</body>
</html>
