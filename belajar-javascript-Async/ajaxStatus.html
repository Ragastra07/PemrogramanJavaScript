<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX with Status</title>
</head>
<body>
    <h1 id="respond"></h1>
<script>
    function displayRespond(json) {
        const header = document.getElementById('respond');
        header.textContent = json.response;
    }
    const ajax = new XMLHttpRequest();
    ajax.onreadystatechange = function () {
        console.info(`ready state change ${ajax.readyState}`);
    }
    ajax.open('GET', 'API/hello.json'); //ini alamat yang benar
    // ajax.open('GET', 'API/salah.json'); //ini alamat yang salah 
    ajax.addEventListener('load', function () {
        if (ajax.status === 200) {
            const json = JSON.parse(ajax.responseText);
            displayRespond(json);   
        } else {
            displayRespond({
                response : `terjadi error dengan status ${ajax.status}`
            })
        }
    });
    ajax.send();
</script>
</body>
</html>
