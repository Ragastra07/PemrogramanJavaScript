<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <label for="search">
            search:
            <input type="text" id="search" name="search">
        </label>
        <br>
        <input type="button" id="searchbutton" name="searchbutton" value="searchbutton">
    </form>
    <h1 id="responds"></h1>
</body>
<script>
    function doSearch() {
        const ajax = new XMLHttpRequest();
        const param = new URLSearchParams();
        param.append('search', document.getElementById('search').value);
        param.append('filter', document.getElementById('search').value);

        ajax.open('GET', `https://eo8nso1iktnps8u.m.pipedream.net?${param.toString()}`);
        ajax.onload = function () {
            const responds = document.getElementById('responds');
            responds.innerText = ajax.responseText;
        }
       
        ajax.send();
    }

    document.getElementById('searchbutton').onclick = doSearch;
</script>
</html>
